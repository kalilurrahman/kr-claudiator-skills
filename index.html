<!doctype html>
<!-- claudiator.kalilurrahman.com has moved into the KR Library. Every path is sent on by this page:
     exact path first, then "/x/*" prefixes, otherwise HOME; utm_* parameters are kept.
     Generated from program/redirect-map.csv (portfolio programme, task P2-A). The old app is
     still in src/ and in git history; it is no longer built (see vite.config). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>This page has moved</title>
  <!-- HOME is also the no-JavaScript fallback -->
  <meta http-equiv="refresh" content="0; url=https://industrybizcapability.kalilurrahman.com/skills/claude">
  <link rel="canonical" href="https://industrybizcapability.kalilurrahman.com/skills/claude">
  <script>
    (function () {
      var HOME = "https://industrybizcapability.kalilurrahman.com/skills/claude";
      // exact paths first, then prefixes ending in "/*"
      var MAP = {
        "/": HOME,
        "/skills": HOME,
        "/guide": HOME,
        "/about": HOME,
        "/feedback": HOME,
        "/favourites": HOME
      };
      var p = window.location.pathname.replace(/\/+$/, "") || "/";
      var to = MAP[p];
      if (!to) {
        for (var k in MAP) {
          if (k.slice(-2) !== "/*") continue;
          var base = k.slice(0, -2);
          if (p === base || p.indexOf(base + "/") === 0) { to = MAP[k]; break; }
        }
      }
      to = to || HOME;
      try {
        new URLSearchParams(window.location.search).forEach(function (v, k) {
          if (k.indexOf("utm_") === 0 && v) to += (to.indexOf("?") < 0 ? "?" : "&") + k + "=" + encodeURIComponent(v);
        });
      } catch (e) {}
      window.location.replace(to);
      document.addEventListener("DOMContentLoaded", function () {
        var a = document.getElementById("to"); a.href = to; a.textContent = to;
      });
    })();
  </script>
  <style>
    body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #14213D; background: #F7F5EF;
           display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; text-align: center; }
    a { color: #1F7A6B; }
  </style>
</head>
<body>
  <p>This page has moved to <a id="to" href="https://industrybizcapability.kalilurrahman.com/skills/claude">https://industrybizcapability.kalilurrahman.com/skills/claude</a>.</p>
</body>
</html>
