name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    name: Content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails on exact-duplicate skills or sub-100-line stubs
      - name: Audit skills (duplicates, stubs, drift report)
        run: python3 scripts/audit_skills.py
      # INDEX.md must match what the generator produces from the tree
      - name: Verify INDEX.md is up to date
        run: |
          python3 scripts/generate_index.py
          git diff --exit-code INDEX.md

  site:
    name: Site tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
